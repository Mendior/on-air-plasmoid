name: Bug report
description: Something in On Air misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I clicked … and …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup
        2. …
  - type: input
    id: version
    attributes:
      label: On Air version
      description: Shown on the widget's About page in its settings.
      placeholder: "2026.31"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Plasma version and distribution
      placeholder: "Plasma 6.4, CachyOS"
    validations:
      required: true
  - type: textarea
    id: backend
    attributes:
      label: Audio backend
      description: >
        Which multimedia backend Qt uses decides how the widget reads track
        titles, so it matters for anything about Now Playing. Paste the output
        of this one command (works on any distribution):
        ls /usr/lib*/qt6/plugins/multimedia/*.so /usr/lib/*/qt6/plugins/multimedia/*.so 2>/dev/null || true
      render: shell
      placeholder: /usr/lib/qt6/plugins/multimedia/libffmpegmediaplugin.so
  - type: textarea
    id: logs
    attributes:
      label: Journal output (if relevant)
      description: >
        The widget tags its own lines with [ARP]. Paste the output of:
        journalctl --user -b --no-pager | grep -iE 'on ?air|\[ARP\]|qt\.multimedia|plasmashell' | tail -80
      render: shell
