# Two-tier gate, mirroring scripts/dev.sh:
#   core — fast, Qt-free: Python compile + unit tests, translations,
#          metadata.json, shell syntax, regression grep rules.
#   qml  — the real thing on an Arch container (same package set as a
#          rolling Plasma 6 desktop): Qt6 qmllint, the qmltestrunner logic
#          tests (tests/qml), and the offscreen plasmoidviewer smoke test
#          that catches engine-level load errors qmllint cannot see.
name: checks

# The gate only reads the tree — the token needs nothing more.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: python + translations + static rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext python3-pytest
      - name: Lint without QML
        run: QMLLINT=none scripts/dev.sh lint

  # The gate's blind spot until 2026.28: every other job here runs on a
  # rolling Arch container with the newest Qt. Qt 6.10 rejected `final` as a
  # reserved word and the widget died at install on Kubuntu 26.04 LTS — no
  # job could have seen it. This one uses the Qt an LTS actually ships and
  # only PARSES: an older Qt knows fewer types, so type warnings here are
  # noise, but a file it cannot read at all is the whole point.
  lts-parse:
    name: LTS Qt parses every QML file
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ubuntu:26.04
    steps:
      - name: Install the distribution's own qmllint
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools ca-certificates git
      - uses: actions/checkout@v4
      - name: Parse every shipped QML file
        shell: bash
        run: |
          set -eu
          ql=/usr/lib/qt6/bin/qmllint
          command -v qmllint6 >/dev/null && ql=$(command -v qmllint6) || true
          echo "using $ql"
          "$ql" --version || true
          fail=0
          while IFS= read -r f; do
            out=$("$ql" "$f" 2>&1 || true)
            if printf '%s' "$out" | grep -qE 'Expected token|Syntax error|Unexpected token|Unterminated'; then
              echo "PARSE ERROR in $f"
              printf '%s\n' "$out" | grep -E 'Expected token|Syntax error|Unexpected token|Unterminated' | head -3
              fail=1
            fi
          done < <(find package -name '*.qml')
          exit $fail

  qml:
    name: qmllint + runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install Plasma toolchain
        run: >
          pacman -Syu --noconfirm --needed
          git which gettext python python-pytest ttf-dejavu dbus
          qt6-declarative qt6-multimedia-ffmpeg
          plasma-sdk plasma-workspace plasma-desktop plasma5support knotifications
          breeze-icons
      - uses: actions/checkout@v4
      - name: Full check (lint + offscreen plasmoidviewer)
        run: dbus-run-session -- scripts/dev.sh check
